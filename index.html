<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Հայերենի Քարտեր</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --accent-yellow: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #e11d48;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 10px;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--text-main);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 50%;
    }

    .stats {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      background: #eef2ff;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 2px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .img-box {
      width: 100%;
      height: 150px;
      border-radius: 16px;
      overflow: hidden;
      background: #f1f5f9;
      margin-bottom: 14px;
      display: none;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mode-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .prompt-text {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .input-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 18px;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      outline: none;
      background: #fff;
      text-align: center;
      color: var(--text-main);
    }

    /* Восточно-армянская клавиатура Mac (խվէրդե...) */
    .armenian-keyboard {
      display: none;
      width: 100%;
      background: #e2e8f0;
      border-radius: 16px;
      padding: 8px;
      gap: 6px;
      flex-direction: column;
      margin-top: 10px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .kb-key {
      flex: 1;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      cursor: pointer;
      text-align: center;
    }
    .kb-key:active {
      background: #cbd5e1;
    }
    .kb-key.action {
      background: #cbd5e1;
      font-size: 13px;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-main);
      text-align: center;
    }
    .opt-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .opt-btn.correct {
      background: #d1fae5 !important;
      border-color: var(--accent-green) !important;
      color: #065f46;
    }
    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: var(--accent-rose) !important;
      color: #991b1b;
    }

    .action-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--text-main);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    /* Зеленая кнопка Дальше */
    .next-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent-green);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: none;
    }

    .footer-controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 10px;
      margin-top: 15px;
      align-items: center;
    }
    
    /* Маленькая нейтральная кнопка Знаю */
    .btn-know {
      padding: 10px 16px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-know:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .btn-audio {
      padding: 10px 16px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    .feedback-msg {
      margin-top: 10px;
      font-weight: 700;
      font-size: 15px;
      text-align: center;
      min-height: 22px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="<Image src="image_generation_content/11191756052859384341" alt="Гранат" />" class="logo-img" alt="Гранат">
      Հայերեն
    </div>
    <div class="stats" id="stats-counter">Սովորված: 0</div>
  </header>

  <div class="app-container">
    <div class="card" id="card-box">
      <div class="img-box" id="img-box">
        <img id="card-img" src="" alt="Иллюстрация">
      </div>
      
      <div class="mode-badge" id="mode-badge">Загрузка</div>
      <div class="prompt-text" id="prompt-text">Секунду</div>

      <div id="exercise-area" style="width: 100%;"></div>
      
      <!-- Восточно-армянская клавиатура Mac (խվէրդե...) -->
      <div class="armenian-keyboard" id="arm-keyboard">
        <div class="kb-row">
          <button class="kb-key" onclick="typeChar('խ')">խ</button>
          <button class="kb-key" onclick="typeChar('վ')">վ</button>
          <button class="kb-key" onclick="typeChar('է')">է</button>
          <button class="kb-key" onclick="typeChar('ռ')">ռ</button>
          <button class="kb-key" onclick="typeChar('տ')">տ</button>
          <button class="kb-key" onclick="typeChar('ը')">ը</button>
          <button class="kb-key" onclick="typeChar('ւ')">ւ</button>
          <button class="kb-key" onclick="typeChar('ի')">ի</button>
          <button class="kb-key" onclick="typeChar('օ')">օ</button>
          <button class="kb-key" onclick="typeChar('պ')">պ</button>
        </div>
        <div class="kb-row">
          <button class="kb-key" onclick="typeChar('ա')">ա</button>
          <button class="kb-key" onclick="typeChar('ս')">ս</button>
          <button class="kb-key" onclick="typeChar('դ')">դ</button>
          <button class="kb-key" onclick="typeChar('ֆ')">ֆ</button>
          <button class="kb-key" onclick="typeChar('գ')">գ</button>
          <button class="kb-key" onclick="typeChar('հ')">հ</button>
          <button class="kb-key" onclick="typeChar('յ')">յ</button>
          <button class="kb-key" onclick="typeChar('կ')">կ</button>
          <button class="kb-key" onclick="typeChar('լ')">լ</button>
          <button class="kb-key" onclick="typeChar('ձ')">ձ</button>
        </div>
        <div class="kb-row">
          <button class="kb-key" onclick="typeChar('զ')">զ</button>
          <button class="kb-key" onclick="typeChar('ծ')">ծ</button>
          <button class="kb-key" onclick="typeChar('ղ')">ղ</button>
          <button class="kb-key" onclick="typeChar('փ')">փ</button>
          <button class="kb-key" onclick="typeChar('բ')">բ</button>
          <button class="kb-key" onclick="typeChar('ն')">ն</button>
          <button class="kb-key" onclick="typeChar('մ')">մ</button>
          <button class="kb-key" onclick="typeChar('շ')">շ</button>
          <button class="kb-key" onclick="deleteChar()">⌫</button>
        </div>
        <div class="kb-row">
          <button class="kb-key" onclick="typeChar('ջ')">ջ</button>
          <button class="kb-key" onclick="typeChar('ճ')">ճ</button>
          <button class="kb-key" onclick="typeChar('ք')">ք</button>
          <button class="kb-key" onclick="typeChar('ց')">ց</button>
          <button class="kb-key" onclick="typeChar('և')">և</button>
          <button class="kb-key" onclick="typeChar('չ')">չ</button>
          <button class="kb-key" onclick="typeChar('ո')">ո</button>
          <button class="kb-key" onclick="typeChar('ե')">ե</button>
        </div>
        <div class="kb-row">
          <button class="kb-key" style="flex: 4;" onclick="typeChar(' ')">пробел</button>
          <button class="kb-key action" style="flex: 2; background: var(--text-main); color: #fff;" onclick="checkInput()">OK</button>
        </div>
      </div>

      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Дальше ➔</button>

      <div class="feedback-msg" id="feedback-msg"></div>
    </div>

    <div class="footer-controls">
      <button class="btn-audio" onclick="playAudio()">🔊 Слушать</button>
      <div style="flex: 1;"></div>
      <button class="btn-know" onclick="markAsKnown()">Знаю слово</button>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzY_RxdjH_dkidV-IP2EjpHwa-jm5uCSoampbOqYF4QOz2IKvfUSTVOVfUIyp89qTIuPOmdHZ_iBwS/pub?output=csv';
    const SAVE_API_URL = 'https://script.google.com/macros/s/AKfycbyKYPb6zu0bO6NAtsm2vJoNn_YKk63MS8xeUjdCKIfflXvtPrCB0u62UVVTV82EKE6F/exec';

    const PROXIES = [
      'https://corsproxy.io/?' + encodeURIComponent(CSV_URL),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL),
      CSV_URL
    ];

    let words = [];
    let currentWord = null;
    let currentMode = 0;
    let waitingForNext = false;

    async function fetchCSV() {
      for (let url of PROXIES) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 20) return text;
          }
        } catch (e) {
          console.warn('Ошибка загрузки:', url);
        }
      }
      throw new Error('Недоступно');
    }

    async function init() {
      try {
        const csvText = await fetchCSV();
        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data;
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (r.length >= 2) {
                const arm = r[0] ? r[0].trim() : '';
                const ru = r[1] ? r[1].trim() : '';
                const vitchak = r[2] ? parseInt(r[2]) || 0 : 0;
                if (arm && arm !== 'բառ' && !arm.startsWith('#')) {
                  words.push({ armenian: arm, russian: ru, level: vitchak });
                }
              }
            }
            if (words.length > 0) nextQuestion();
            else document.getElementById('prompt-text').innerText = 'Нет данных';
          }
        });
      } catch (e) {
        document.getElementById('prompt-text').innerText = 'Ошибка загрузки';
      }
    }

    async function saveProgressToSheet(armenianWord, level) {
      if (!SAVE_API_URL) return;
      try {
        const url = `${SAVE_API_URL}?word=${encodeURIComponent(armenianWord)}&level=${level}`;
        await fetch(url, { mode: 'no-cors' });
      } catch (err) {
        console.error(err);
      }
    }

    function nextQuestion() {
      waitingForNext = false;
      document.getElementById('feedback-msg').innerText = '';
      document.getElementById('img-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('arm-keyboard').style.display = 'none';
      document.getElementById('card-box').style.borderColor = 'var(--border-color)';

      const activeWords = words.filter(w => w.level < 7);
      if (activeWords.length === 0) {
        document.getElementById('prompt-text').innerText = 'Все слова выучены';
        document.getElementById('exercise-area').innerHTML = '';
        return;
      }

      currentWord = activeWords[Math.floor(Math.random() * activeWords.length)];
      currentMode = Math.floor(Math.random() * 4);

      const badge = document.getElementById('mode-badge');
      const prompt = document.getElementById('prompt-text');
      const area = document.getElementById('exercise-area');
      area.innerHTML = '';

      if (currentMode === 0) {
        badge.innerText = 'Написание по-армянски';
        prompt.innerText = currentWord.russian;
        area.innerHTML = `
          <div class="input-box">
            <input type="text" id="user-input" readonly placeholder="Нажмите клавиши ниже" autocomplete="off">
            <button class="action-btn" onclick="checkInput()">Проверить</button>
          </div>
        `;
        document.getElementById('arm-keyboard').style.display = 'flex';

      } else if (currentMode === 1) {
        badge.innerText = 'Перевод на русский';
        prompt.innerText = currentWord.armenian;
        renderOptions('russian', getDistractors('russian', currentWord.russian));

      } else if (currentMode === 2) {
        badge.innerText = 'Выбор армянского слова';
        prompt.innerText = currentWord.russian;
        renderOptions('armenian', getDistractors('armenian', currentWord.armenian));

      } else if (currentMode === 3) {
        badge.innerText = 'Аудиопроверка';
        prompt.innerText = 'Прослушайте и выберите слово';
        playAudio();
        renderOptions('russian', getDistractors('russian', currentWord.russian));
      }

      updateStats();
    }

    function typeChar(char) {
      const input = document.getElementById('user-input');
      if (input) input.value += char;
    }

    function deleteChar() {
      const input = document.getElementById('user-input');
      if (input) input.value = input.value.slice(0, -1);
    }

    function getDistractors(field, correctValue) {
      let pool = words.map(w => w[field]).filter(v => v !== correctValue);
      pool.sort(() => Math.random() - 0.5);
      let options = pool.slice(0, 3);
      options.push(correctValue);
      options.sort(() => Math.random() - 0.5);
      return options;
    }

    function renderOptions(field, options) {
      const area = document.getElementById('exercise-area');
      let html = '<div class="options-grid">';
      options.forEach(opt => {
        // Убрали любые предварительные классы, кнопки чистые
        html += `<button class="opt-btn" onclick="checkOption(this, '${opt.replace(/'/g, "\\'")}', '${currentWord[field].replace(/'/g, "\\'")}')">${opt}</button>`;
      });
      html += '</div>';
      area.innerHTML = html;
    }

    function checkInput() {
      if (waitingForNext) return;
      const input = document.getElementById('user-input');
      if (!input) return;
      const val = input.value.trim();
      const isCorrect = val.toLowerCase() === currentWord.armenian.toLowerCase();
      handleAnswer(isCorrect);
    }

    function checkOption(btn, selected, correct) {
      if (waitingForNext) return;
      const isCorrect = selected === correct;
      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach(b => {
        if (b.innerText === correct) b.classList.add('correct');
        if (b === btn && !isCorrect) b.classList.add('wrong');
        b.onclick = null;
      });
      handleAnswer(isCorrect);
    }

    function handleAnswer(isCorrect) {
      waitingForNext = true;
      const msg = document.getElementById('feedback-msg');
      const cardBox = document.getElementById('card-box');
      
      showImage(currentWord.russian);
      document.getElementById('prompt-text').innerText = `${currentWord.armenian} — ${currentWord.russian}`;
      document.getElementById('arm-keyboard').style.display = 'none';

      if (isCorrect) {
        cardBox.style.borderColor = 'var(--accent-green)';
        msg.style.color = 'var(--accent-green)';
        msg.innerText = 'Верно';
        currentWord.level = Math.min(7, currentWord.level + 1);
        saveProgressToSheet(currentWord.armenian, currentWord.level);
        setTimeout(nextQuestion, 1400);
      } else {
        cardBox.style.borderColor = 'var(--accent-rose)';
        msg.style.color = 'var(--accent-rose)';
        msg.innerText = `Ошибка: ${currentWord.armenian}`;
        currentWord.level = Math.max(0, currentWord.level - 1);
        saveProgressToSheet(currentWord.armenian, currentWord.level);
        document.getElementById('exercise-area').innerHTML = '';
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function showImage(keyword) {
      const clean = keyword.split(/[,;(]/)[0].trim();
      const imgBox = document.getElementById('img-box');
      const img = document.getElementById('card-img');
      img.src = `https://picsum.photos/seed/${encodeURIComponent(clean)}/400/250`;
      imgBox.style.display = 'block';
    }

    function playAudio() {
      if (!currentWord) return;
      // Внешний облачный синтезатор для гарантии озвучки на iOS
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(currentWord.armenian)}&tl=hy&client=tw-ob`;
      const audio = new Audio(audioUrl);
      audio.play().catch(err => {
        console.warn('Ошибка воспроизведения аудио:', err);
      });
    }

    function markAsKnown() {
      if (!currentWord) return;
      currentWord.level = 7;
      saveProgressToSheet(currentWord.armenian, 7);
      nextQuestion();
    }

    function updateStats() {
      const learned = words.filter(w => w.level >= 7).length;
      document.getElementById('stats-counter').innerText = `Выучено: ${learned} / ${words.length}`;
    }

    init();
  </script>
</body>
</html>
