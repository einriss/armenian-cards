<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --accent-yellow: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 15px;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--primary);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      background: #eef2ff;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 2px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .img-box {
      width: 100%;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      background: #f1f5f9;
      margin-bottom: 16px;
      display: none;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mode-badge {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--primary);
      background: #f3e8ff;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .prompt-text {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .input-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
